version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: muni-postgres
    environment:
      POSTGRES_DB: ${PGVECTOR_DATABASE:-ragdb}
      POSTGRES_USER: ${PGVECTOR_USER:-postgres}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-postgres}
    ports:
      - "${PGVECTOR_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USER:-postgres} -d ${PGVECTOR_DATABASE:-ragdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: muni-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-init:
    image: ollama/ollama:latest
    container_name: muni-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./backend/docker/ollama-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: muni-backend
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OLLAMA_BASE_URL: http://ollama:11434
      PGVECTOR_HOST: postgres
      PGVECTOR_DATABASE: ${PGVECTOR_DATABASE:-ragdb}
      PGVECTOR_USER: ${PGVECTOR_USER:-postgres}
      PGVECTOR_PASSWORD: ${PGVECTOR_PASSWORD:-postgres}
      AUTO_INGEST_ON_STARTUP: ${AUTO_INGEST_ON_STARTUP:-false}
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: muni-phoenix
    ports:
      - "6006:6006"
    volumes:
      - phoenix:/phoenix

volumes:
  pgdata:
  ollama:
  phoenix:
